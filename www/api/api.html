<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPP API</title>
</head>
<body>
  <script
    id="api-reference"
    data-url="/api/openapi.json"
    data-configuration='{
      "theme": "none",
      "layout": "modern",
      "defaultOpenAllTags": false,
      "metaData": {
        "title": "FPP API"
      },
      "agent": {
        "disabled": true
      },
      "mcp": {
        "disabled": true
      },
      "hideDarkModeToggle": true,
      "customCss": ":root{--scalar-color-1:#333333;--scalar-color-2:rgba(51,51,51,0.65);--scalar-color-3:rgba(51,51,51,0.40);--scalar-color-accent:#007bff;--scalar-background-1:#ffffff;--scalar-background-2:#f8f9fa;--scalar-background-3:#e9ecef;--scalar-background-accent:rgba(0,123,255,0.06);--scalar-border-color:rgba(0,0,0,0.10);}@media(prefers-color-scheme:dark){:root{--scalar-color-1:#dee2e6;--scalar-color-2:rgba(222,226,230,0.65);--scalar-color-3:rgba(222,226,230,0.40);--scalar-color-accent:#6ea8fe;--scalar-background-1:#212529;--scalar-background-2:#2c3034;--scalar-background-3:#343a40;--scalar-background-accent:rgba(110,168,254,0.08);--scalar-border-color:rgba(255,255,255,0.10);}}.badge{color:#ffffff!important;}"
    }'
  ></script>
  <script>
    // navigator.clipboard only exists in a secure context (HTTPS or
    // localhost) -- FPP is normally reached over plain HTTP on a LAN IP,
    // where it's simply undefined. Scalar's copy-link/copy-as-curl buttons
    // call navigator.clipboard.writeText() directly and have no fallback,
    // so they fail with "Failed to copy to clipboard" there. Same root
    // cause and same fallback (hidden textarea + execCommand('copy')) as
    // CopyTextToClipboard() in js/fpp.js -- polyfilled here, before scalar.js
    // loads, since Scalar's own vendored bundle can't be edited directly.
    if (!(navigator.clipboard && navigator.clipboard.writeText)) {
      navigator.clipboard = Object.assign({}, navigator.clipboard, {
        writeText: function (text) {
          var $ta = document.createElement('textarea');
          $ta.readOnly = true;
          $ta.value = text;
          $ta.style.position = 'fixed';
          $ta.style.top = '-1000px';
          $ta.style.left = '-1000px';
          document.body.appendChild($ta);
          $ta.select();
          try {
            document.execCommand('copy');
          } catch (e) {
            // nothing more we can do
          }
          document.body.removeChild($ta);
          return Promise.resolve();
        }
      });
    }
  </script>
  <script src="/js/scalar.js"></script>
</body>
</html>
