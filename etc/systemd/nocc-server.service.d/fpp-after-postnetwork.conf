# Start the nocc helper only once the box has its real address.
#
# nocc-server -advertise-mdns answers mDNS itself rather than through avahi, and
# it takes the interface addresses once, at startup, and never refreshes them.
# network-online.target does not wait for a DHCP lease here, so a helper that
# starts a few seconds early advertises whatever it had at that moment -- a
# link-local IPv6 address, or the short-lived tether address -- and every client
# that discovers it is handed a server it cannot reach.
#
# fpp_postnetwork is Type=notify and reports ready only after an interface has
# an IP address, so ordering after it closes that window. After= only: on a box
# without FPP's unit this is a no-op, and it does not pull postNetwork in.
[Unit]
After=fpp_postnetwork.service
