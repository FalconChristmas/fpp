# A configured WiFi adapter that is not plugged in must not hold up boot.
#
# wpa_supplicant@<if> requires its interface's device unit and orders itself
# before network.target, which fpp_postnetwork -- and so fppd -- waits for.
# With the adapter missing, its start job sits out the device unit's 90s
# default timeout, and the whole boot with it. Give up after 30s instead,
# which is well past the time a USB adapter takes to enumerate behind a hub.
# An adapter that appears after that is started by
# /etc/udev/rules.d/80-fpp-wpa-supplicant.rules.
#
# FPP writes wpa_supplicant-<if>.conf only for an interface it is to run as a
# WiFi client, and removes it when the interface becomes the tether AP, so
# without one there is nothing to start.
[Unit]
JobTimeoutSec=30s
ConditionPathExists=/etc/wpa_supplicant/wpa_supplicant-%I.conf
